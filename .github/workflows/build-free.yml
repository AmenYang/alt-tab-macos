name: build-alttab-free

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10.12.0
          fetch-depth: 1

      - name: Show toolchain
        run: xcodebuild -version; swift --version; ls Pods | head

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -workspace alt-tab-macos.xcworkspace \
            -scheme Release \
            -configuration Release \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Locate app
        if: always()
        run: |
          find DerivedData/Build/Products -maxdepth 3 -name "*.app" -print 2>/dev/null
          find DerivedData/Build/Products -maxdepth 4 -path "*MacOS*" -print 2>/dev/null

      - name: Ad-hoc sign and package
        if: always()
        run: |
          APP="$(find DerivedData/Build/Products -maxdepth 3 -name 'AltTab.app' | head -1)"
          echo "APP=$APP"
          if [ -n "$APP" ] && [ -f "$APP/Contents/MacOS/AltTab" ]; then
            codesign --force --deep --sign - "$APP"
            ditto -c -k --sequesterRsrc --keepParent "$APP" "AltTab-10.12.0-unsigned.zip"
            ls -lh "AltTab-10.12.0-unsigned.zip"
          else
            echo "no usable app produced"; ls -R "$APP" | head -20
          fi

      - name: Publish release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v10.12.0-free
          name: AltTab 10.12.0 (free build)
          body: Built from GPL-3.0 source at tag v10.12.0.
          files: |
            build.log
            AltTab-10.12.0-unsigned.zip
