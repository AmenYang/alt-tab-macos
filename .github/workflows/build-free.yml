name: build-alttab-free

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10.12.0
          fetch-depth: 1

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Build
        run: |
          xcodebuild -workspace alt-tab-macos.xcworkspace \
            -scheme Release \
            -configuration Release \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_OPTIONAL=YES \
            2>&1 | tail -60

      - name: Locate app
        run: |
          find DerivedData/Build/Products -maxdepth 2 -name "*.app" -print

      - name: Ad-hoc sign and package
        run: |
          APP="$(find DerivedData/Build/Products -maxdepth 2 -name 'AltTab.app' | head -1)"
          echo "APP=$APP"
          codesign --force --deep --sign - "$APP" || true
          ditto -c -k --sequesterRsrc --keepParent "$APP" "AltTab-10.12.0-unsigned.zip"
          ls -lh AltTab-10.12.0-unsigned.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v10.12.0-free
          name: AltTab 10.12.0 (free build)
          body: Built from GPL-3.0 source at tag v10.12.0, unsigned/ad-hoc signed.
          files: AltTab-10.12.0-unsigned.zip
